name: SaaS - サロン別投稿生成

on:
  schedule:
    # 週1回だと、1回のスキップ/生成失敗で在庫が枯渇しかける（2026-07-13 瀧本さん昼が残0本まで進行した反省）。
    # 在庫が足りていれば何もしない冪等設計なので、毎日2回チェックして「絶対に止まらない」を担保する。
    # 11時開始＝月曜のresearch(10時台)によるルール更新の後に生成するため（push競合・旧ルール生成の回避）。
    - cron: '0 2 * * *'   # 毎日 11:00 JST
    - cron: '0 8 * * *'   # 毎日 17:00 JST（11時がGitHub側でスキップ/失敗した時の保険・21時投稿に間に合う）
  workflow_dispatch:
    inputs:
      salon_name:
        description: '特定サロンのみ生成する場合はサロン名を入力（空欄で全サロン）'
        required: false
        default: ''
      force_promo:
        description: '月曜宣伝枠の文章を在庫に関係なく補充する（動作確認用）'
        required: false
        type: boolean
        default: false

concurrency:
  group: saas-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # クライアント投稿の隔離先（private リポ）。生成後にここへ振り分けて公開リポには残さない。
      - name: private投稿リポを取得（クライアント隔離先）
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: AyaKuroki929/saas-posts
          ssh-key: ${{ secrets.SAAS_POSTS_DEPLOY_KEY }}
          path: .saas_posts_private

      # ⭐ private の既存投稿を生成の入力に取り込む（これが無いと全クライアントが
      #    「ファイル無し＝初回」と誤認され、毎週全員分を再生成→誤通知→プール上書きになる。2026-07-13の事故）
      - name: private投稿を生成入力へ取り込み
        run: |
          mkdir -p posts_saas
          if [ -d .saas_posts_private ]; then
            n=0
            for f in .saas_posts_private/posts_*.json; do
              [ -e "$f" ] || continue
              cp "$f" posts_saas/ && n=$((n+1))
            done
            echo "private投稿 $n 件を posts_saas/ に取り込み"
          else
            echo "::error::private投稿リポの取得に失敗。生成すると全クライアントを初回扱いで再生成してしまうため中断する"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic gspread google-auth

      - name: Write Google Service Account
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SA_JSON" > google_service_account.json

      - name: Generate posts for all salons
        if: ${{ github.event.inputs.salon_name == '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADMIN_NOTIFY_LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
        run: python3 generate_saas_posts.py

      - name: Generate posts for specific salon
        if: ${{ github.event.inputs.salon_name != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADMIN_NOTIFY_LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
        run: python3 generate_saas_posts.py "${{ github.event.inputs.salon_name }}"

      # 個人アカの月曜21時「とうこさん」宣伝枠の文章在庫。週1本しか使わないが、
      # 在庫が2本を切ったら3本足す（足りていれば何もしない冪等設計）。
      - name: Refill promo posts (personal Monday)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 generate_promo_posts.py ${{ inputs.force_promo && '--force' || '' }}

      - name: Remove service account file
        if: always()
        run: rm -f google_service_account.json

      # 自社アカ（公開OK）以外＝第三者クライアントの投稿ファイルを private リポへ隔離し、
      # 公開リポの作業ツリーから除外する（次の Commit で公開リポに載らないようにする）。
      # 新規クライアントも allowlist 外として自動で private 側へ回る。
      - name: クライアント投稿を private へ隔離（公開リポに残さない）
        if: ${{ !cancelled() }}
        run: |
          PUBLIC_KEEP="posts_bemolle_diet.json posts_aya_kuroki_0929.json posts_urakata_san_official.json posts_toko_test.json posts_て.json posts_テスト.json"
          moved=0
          if [ -d .saas_posts_private ]; then
            for f in posts_saas/posts_*.json; do
              [ -e "$f" ] || continue
              b=$(basename "$f"); keep=0
              for k in $PUBLIC_KEEP; do [ "$b" = "$k" ] && keep=1; done
              if [ "$keep" = "0" ]; then cp "$f" .saas_posts_private/ && rm "$f" && moved=$((moved+1)); fi
            done
            echo "クライアント $moved 件を private へ隔離"
            if [ -d .saas_posts_private/.git ]; then
              cd .saas_posts_private
              git config user.name "github-actions[bot]"; git config user.email "gha@users.noreply.github.com"
              git add -A
              if ! git diff --cached --quiet; then
                git commit -q -m "saas: クライアント投稿を更新 $(TZ=Asia/Tokyo date '+%F %H:%M JST')"
                for i in 1 2 3; do git push && break; git pull --rebase && sleep 2; done
              fi
              cd ..
            fi
          else
            echo "::warning::private取得に失敗。クライアント投稿を公開ツリーから除外のみ実施（private未更新）"
            for f in posts_saas/posts_*.json; do
              [ -e "$f" ] || continue
              b=$(basename "$f"); keep=0
              for k in $PUBLIC_KEEP; do [ "$b" = "$k" ] && keep=1; done
              [ "$keep" = "0" ] && rm "$f"
            done
          fi

      # シート読込失敗(exit 2)でも、同一実行で生成済みのローカル定義サロン分は
      # ディスクに書かれているため必ずコミットする（skipすると生成分が消滅する）
      - name: Commit generated posts
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A posts_saas/ promo_posts_personal.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "saas: posts_saas を更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          # Push競合に強くする：失敗したら git pull --rebase してリトライ（最大5回）
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push failed on attempt $i, pulling latest and retrying..."
            git pull --rebase origin main
            sleep 2
          done
          echo "Push failed after 5 attempts"
          exit 1

      - name: Notify LINE on failure
        if: failure() || cancelled()  # timeout超過はcancelled扱いでfailure()に掛からない（実機検証済み）
        env:
          LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
        run: |
          SALON="${{ github.event.inputs.salon_name }}"
          if [ -z "$SALON" ]; then SALON="全サロン"; fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="🚨 とうこさんSaaS 投稿生成ワークフロー失敗\n\n対象：$SALON\nトリガー：${{ github.event_name }}\n\n→ クライアントの自動投稿が始まらないリスクあり。\n\nログ確認：\n$RUN_URL"
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"$TEXT\"}]}"
