name: SaaS - サロン別投稿生成

on:
  schedule:
    - cron: '0 1 * * 1'  # 毎週月曜 AM10時(JST)
  workflow_dispatch:
    inputs:
      salon_name:
        description: '特定サロンのみ生成する場合はサロン名を入力（空欄で全サロン）'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic gspread google-auth

      - name: Write Google Service Account
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SA_JSON" > google_service_account.json

      - name: Generate posts for all salons
        if: ${{ github.event.inputs.salon_name == '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 generate_saas_posts.py

      - name: Generate posts for specific salon
        if: ${{ github.event.inputs.salon_name != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 generate_saas_posts.py "${{ github.event.inputs.salon_name }}"

      - name: Remove service account file
        if: always()
        run: rm -f google_service_account.json

      - name: Commit generated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts_saas/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "saas: posts_saas を更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          # Push競合に強くする：失敗したら git pull --rebase してリトライ（最大5回）
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push failed on attempt $i, pulling latest and retrying..."
            git pull --rebase origin main
            sleep 2
          done
          echo "Push failed after 5 attempts"
          exit 1

      - name: Notify LINE on completion
        if: success() && github.event.inputs.salon_name != ''
        env:
          LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
        run: |
          TEXT="✅ 投稿生成完了！\n\nThreads ID：@${{ github.event.inputs.salon_name }}\n\n本日から自動配信が開始されます。"
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"$TEXT\"}]}"

      - name: Notify LINE on failure
        if: failure()
        env:
          LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
        run: |
          SALON="${{ github.event.inputs.salon_name }}"
          if [ -z "$SALON" ]; then SALON="全サロン"; fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="🚨 とうこさんSaaS 投稿生成ワークフロー失敗\n\n対象：$SALON\nトリガー：${{ github.event_name }}\n\n→ クライアントの自動投稿が始まらないリスクあり。\n\nログ確認：\n$RUN_URL"
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"$TEXT\"}]}"
