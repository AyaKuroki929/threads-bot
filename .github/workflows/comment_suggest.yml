name: Threads Auto Like (ベモーレ・個人)

# 2026-07-02: コメント提案機能を廃止し、いいね自動化のみに機能を絞った。
# 旧名: bemolle Comment Suggest（コメント候補をLINE送信）
# ワークフローファイル名 (comment_suggest.yml) は cron-job.org の発火URLに使われているため変更しない。
on:
  # GitHub内蔵scheduleは遅延/スキップが多いため、cron-job.org の
  # repository_dispatch(comment-morning/noon/evening) で毎日3回発火。
  repository_dispatch:
    types: [comment-morning, comment-noon, comment-evening]
  workflow_dispatch:

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 人間らしいペーシング（開始ジッター最大5分＋いいね間隔8〜40秒×2アカ）のため拡大
    permissions:
      contents: write
    env:
      TZ: Asia/Tokyo
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
      ADMIN_NOTIFY_LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
      THREADS_SESSION: ${{ secrets.THREADS_SESSION }}
      THREADS_SESSION_PERSONAL: ${{ secrets.THREADS_SESSION_PERSONAL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright anthropic -q
          playwright install chromium --with-deps

      - name: Pull latest state
        run: |
          git config user.email "bot@github-actions"
          git config user.name "threads-bot"
          git pull --rebase --autostash origin main 2>&1 || true

      - name: 自動いいね（ベモーレ・個人）
        continue-on-error: true
        run: |
          if [ -n "$THREADS_SESSION" ]; then
            python3 like_auto.py bemolle || echo "bemolle like 失敗"
          fi
          if [ -n "$THREADS_SESSION_PERSONAL" ]; then
            python3 like_auto.py personal || echo "personal like 失敗"
          fi

      - name: Commit state
        run: |
          # like_verify_queue*=反映検証キュー / like_pause*=自動休止マーカー / like_alert_state*=LINE警告の重複抑制
          # 存在しないファイルが混ざると git add 全体が失敗するため1ファイルずつ（-A で削除も反映）
          for f in liked_posts.json liked_posts_personal.json \
                   comment_targets.json comment_targets_personal.json \
                   like_verify_queue.json like_verify_queue_personal.json \
                   like_pause.json like_pause_personal.json \
                   like_alert_state.json like_alert_state_personal.json; do
            git add -A -- "$f" 2>/dev/null || true
          done
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "state: auto like $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash -X ours origin main 2>&1 || true
              git push && break
              sleep $((RANDOM % 8 + 4))
            done
          fi
