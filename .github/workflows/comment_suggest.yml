name: Threads Auto Like (廃止・停止中)

# ⛔ 2026-07-14 廃止：Threadsの自動いいねがMetaのアクション制限（シャドウ制限）を
#    繰り返し受けるため撤去。Sol(GPT)にも相談し「住宅IPで延命せず公式APIの投稿に絞る」
#    のが最善と結論（公式Threads APIに「いいね実行」エンドポイントは存在しない）。
#    集客の本命は投稿の質。いいねはアカウント資産を毀損しやすく実利も薄いため停止。
#
# 経緯: bemolle Comment Suggest（コメント候補LINE送信）
#       → 2026-07-02 コメント廃止・いいねのみに
#       → 2026-07-14 いいねも廃止（このファイル）
#
# 自動発火（repository_dispatch / schedule）は撤去。cron-job.org 側の
# comment-morning/noon/evening ジョブが叩いても、workflow_dispatch のみ受けるため何も起きない。
# 再開したくなったら repository_dispatch を戻し、下の job を復活させる。

on:
  workflow_dispatch:   # 手動実行のみ（動作確認・一時的な再開検証用）

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: 停止中の告知
        run: |
          echo "自動いいねは 2026-07-14 に廃止されました。"
          echo "投稿（公式Threads API）は post_saas.yml / post.yml で継続しています。"
