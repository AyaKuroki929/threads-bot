name: Auto Comment (bemolle + personal)

on:
  repository_dispatch:
    types: [comment-morning, comment-noon, comment-evening]
  workflow_dispatch:
    inputs:
      account:
        description: 'アカウント'
        required: true
        type: choice
        options: [bemolle, personal, both]
        default: both
      dry_run:
        description: 'dry-run（実際にはコメントしない）'
        type: boolean
        default: false

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TZ: Asia/Tokyo
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright anthropic -q
          playwright install chromium --with-deps

      - name: Determine targets
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bemolle=${{ github.event.inputs.account == 'bemolle' || github.event.inputs.account == 'both' }}" >> $GITHUB_OUTPUT
            echo "personal=${{ github.event.inputs.account == 'personal' || github.event.inputs.account == 'both' }}" >> $GITHUB_OUTPUT
            echo "dry=${{ github.event.inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            echo "bemolle=true" >> $GITHUB_OUTPUT
            echo "personal=true" >> $GITHUB_OUTPUT
            echo "dry=false" >> $GITHUB_OUTPUT
          fi

      - name: Pull latest state
        run: |
          git config user.email "bot@github-actions"
          git config user.name "threads-bot"
          git pull --rebase origin main 2>&1 || true

      - name: Comment (bemolle)
        id: comment_bemolle
        if: steps.target.outputs.bemolle == 'true'
        continue-on-error: true
        env:
          THREADS_SESSION: ${{ secrets.THREADS_SESSION }}
          IG_USERNAME_BEMOLLE: ${{ secrets.IG_USERNAME_BEMOLLE }}
          IG_PASSWORD_BEMOLLE: ${{ secrets.IG_PASSWORD_BEMOLLE }}
          MAX_COMMENTS_PER_RUN: "3"
          COMMENT_COOLDOWN_DAYS: "14"
          COMMENT_WAIT_MIN_MS: "15000"
          COMMENT_WAIT_MAX_MS: "40000"
        run: |
          if [ -z "$THREADS_SESSION" ]; then
            echo "⚠️ THREADS_SESSION 未設定 → スキップ"
            exit 0
          fi
          if [ "${{ steps.target.outputs.dry }}" = "true" ]; then
            python3 comment.py bemolle --dry-run
          else
            python3 comment.py bemolle
          fi

      - name: Comment (personal)
        id: comment_personal
        if: steps.target.outputs.personal == 'true'
        continue-on-error: true
        env:
          THREADS_SESSION_PERSONAL: ${{ secrets.THREADS_SESSION_PERSONAL }}
          IG_USERNAME_PERSONAL: ${{ secrets.IG_USERNAME_PERSONAL }}
          IG_PASSWORD_PERSONAL: ${{ secrets.IG_PASSWORD_PERSONAL }}
          MAX_COMMENTS_PER_RUN: "3"
          GLOBAL_RATELIMIT_HOURS: "6"
          COMMENT_WAIT_MIN_MS: "30000"
          COMMENT_WAIT_MAX_MS: "90000"
        run: |
          if [ -z "$THREADS_SESSION_PERSONAL" ]; then
            echo "⚠️ THREADS_SESSION_PERSONAL 未設定 → スキップ"
            exit 0
          fi
          if [ "${{ steps.target.outputs.dry }}" = "true" ]; then
            python3 comment.py personal --dry-run
          else
            python3 comment.py personal
          fi

      - name: セッションをスリム化（GH Secrets上限対策）
        run: |
          python3 - <<'EOF'
          import json, os
          for fname in ["session.json", "session_personal.json"]:
              if not os.path.exists(fname):
                  continue
              try:
                  data = json.load(open(fname, encoding="utf-8"))
                  domains = ["threads.net", "threads.com", "instagram.com"]
                  original = len(data.get("cookies", []))
                  data["cookies"] = [
                      c for c in data.get("cookies", [])
                      if any(d in c.get("domain", "") for d in domains)
                  ]
                  slimmed = len(data["cookies"])
                  with open(fname, "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False)
                  print(f"{fname}: {original} → {slimmed} cookies (slimmed)")
              except Exception as e:
                  print(f"{fname}: slim化失敗 ({e})")
          EOF

      - name: セッションをGH Secretsに書き戻し（Mac不要化）
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f session.json ] && [ -n "$GH_TOKEN" ]; then
            gh secret set THREADS_SESSION --repo ${{ github.repository }} < session.json \
              && echo "✅ bemolle セッション更新" || echo "⚠️ bemolle セッション更新失敗"
          fi
          if [ -f session_personal.json ] && [ -n "$GH_TOKEN" ]; then
            gh secret set THREADS_SESSION_PERSONAL --repo ${{ github.repository }} < session_personal.json \
              && echo "✅ personal セッション更新" || echo "⚠️ personal セッション更新失敗"
          fi

      - name: Commit state
        if: steps.target.outputs.dry != 'true'
        run: |
          git add commented_posts.json commented_posts_personal.json comment_targets.json comment_targets_personal.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "state: auto comment $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main 2>/dev/null || true
              git push && break || sleep 3
            done
          fi

      - name: LINE通知（エラー時）
        if: |
          always() &&
          steps.target.outputs.dry != 'true' &&
          (steps.comment_bemolle.outcome == 'failure' || steps.comment_personal.outcome == 'failure')
        run: |
          MSG=""
          if [ "${{ steps.comment_bemolle.outcome }}" = "failure" ]; then
            MSG="${MSG}⚠️ ベモーレ 自動コメント エラー\n"
          fi
          if [ "${{ steps.comment_personal.outcome }}" = "failure" ]; then
            MSG="${MSG}⚠️ 個人 自動コメント エラー\n"
          fi
          MSG="${MSG}https://github.com/AyaKuroki929/threads-bot/actions"
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"${MSG}\"}]}"
