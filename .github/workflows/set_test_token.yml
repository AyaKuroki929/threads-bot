name: テスト用トークンをSupabaseにセット（一時ワークフロー）

on:
  workflow_dispatch:

jobs:
  set_token:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TOKEN: ${{ secrets.THREADS_API_TOKEN_PERSONAL }}

    steps:
      - name: toko_testサロンのaccess_tokenを更新
        run: |
          python3 - <<'PYEOF'
          import urllib.request, urllib.parse, json, os

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_SERVICE_KEY"]
          TOKEN        = os.environ["TOKEN"]

          headers = {
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}",
              "Content-Type": "application/json",
              "Prefer": "return=minimal",
          }

          # threads_user_id を TOKEN から取得
          url = f"https://graph.threads.net/v1.0/me?fields=id,username&access_token={urllib.parse.quote(TOKEN)}"
          with urllib.request.urlopen(url, timeout=15) as r:
              me = json.loads(r.read())
          user_id = str(me["id"])
          username = me.get("username", "")
          print(f"user_id={user_id}, username={username}")

          # toko_test サロンを更新
          patch_url = f"{SUPABASE_URL}/rest/v1/salons?salon_name=eq.toko_test"
          data = json.dumps({"access_token": TOKEN, "threads_user_id": user_id}).encode()
          req = urllib.request.Request(patch_url, data=data, headers=headers, method="PATCH")
          with urllib.request.urlopen(req, timeout=15) as r:
              print(f"更新完了: HTTP {r.status}")
          PYEOF
