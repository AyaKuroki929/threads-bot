name: Threads Auto Post (bemolle)

on:
  schedule:
    - cron: '0 22 * * *'    # JST 7:00 morning
    - cron: '0 3 * * *'     # JST 12:00 noon
    - cron: '0 12 * * *'    # JST 21:00 evening
  workflow_dispatch:
    inputs:
      slot:
        description: '時間帯'
        required: true
        type: choice
        options:
          - morning
          - noon
          - evening
      dry_run:
        description: 'dry-run（実際には投稿しない）'
        type: boolean
        default: false

concurrency:
  group: threads-${{ (contains(github.event.schedule, ' 22 ') && 'morning') || (contains(github.event.schedule, ' 3 ') && 'noon') || (contains(github.event.schedule, ' 12 ') && 'evening') || github.event.inputs.slot || 'manual' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    env:
      TZ: Asia/Tokyo
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      THREADS_USERNAME: bemolle_diet
      POSTS_FILE: posts.json
      USED_FILE: used_posts.json
      LAST_RUN_FILE: last_run.json
      PRIORITY_FILE: priority_posts.json
      THREADS_USER_ID: '27445535948404811'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
            echo "dry=${{ github.event.inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 22 * * *") echo "name=morning" >> $GITHUB_OUTPUT ;;
              "0 3 * * *")  echo "name=noon"    >> $GITHUB_OUTPUT ;;
              "0 12 * * *") echo "name=evening" >> $GITHUB_OUTPUT ;;
            esac
            echo "dry=false" >> $GITHUB_OUTPUT
          fi

      - name: Pull latest state（重複投稿防止）
        if: steps.slot.outputs.dry != 'true'
        run: |
          git config user.email "bot@github-actions"
          git config user.name "threads-bot"
          git pull --rebase origin main 2>&1 || true

      - name: Post to Threads（公式API）
        id: post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_API_TOKEN_BEMOLLE }}
          SKIP_TIME_GUARD: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${{ secrets.THREADS_API_TOKEN_BEMOLLE }}" ]; then
            echo "⚠️ THREADS_API_TOKEN_BEMOLLE が未設定です。get_threads_token.py bemolle を実行してGH Secretsに登録してください。"
            echo "exit_code=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          set +e
          if [ "${{ steps.slot.outputs.dry }}" = "true" ]; then
            python3 post_api.py ${{ steps.slot.outputs.name }} --dry-run
          else
            python3 post_api.py ${{ steps.slot.outputs.name }}
          fi
          ec=$?
          echo "exit_code=$ec" >> $GITHUB_OUTPUT
          exit $ec

      - name: Create Token-Expired alert（exit code 3 のみ）
        id: alert_token
        if: failure() && steps.post.outputs.exit_code == '3'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toLocaleDateString('ja-JP', {timeZone: 'Asia/Tokyo'})
            const slot = '${{ steps.slot.outputs.name }}'
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'token-expired-bemolle',
              per_page: 5
            })
            if (existing.data.length > 0) {
              core.setOutput('created', 'false')
              return
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔑 ベモーレThreads トークン切れ - 再取得が必要 (${today})`,
              body: [
                `ベモーレアカウント(@bemolle_diet)のThreads自動投稿が **トークン切れ** で停止しました（${today} ${slot}）。`,
                ``,
                `## やること（Macのターミナルで）`,
                `\`\`\`bash`,
                `cd ~/threads_bot`,
                `export META_APP_SECRET=シークレットをここに貼る`,
                `python3 get_threads_token.py bemolle`,
                `# 表示されたコマンドを実行してGH Secretsに登録`,
                `\`\`\``,
                ``,
                `完了後、本workflowを手動再実行：`,
                `\`\`\``,
                `gh workflow run post.yml -f slot=${slot} -f dry_run=false`,
                `\`\`\``,
                ``,
                `対応完了したらこのIssueをcloseしてください。`,
              ].join('\n'),
              labels: ['token-expired-bemolle']
            })
            core.setOutput('created', 'true')

      - name: LINE通知（トークン切れ）
        if: failure() && steps.alert_token.outputs.created == 'true'
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"type":"text","text":"🔑 ベモーレThreads 停止\n\nAPIトークン切れで投稿できなくなりました。\n\n📱 対応してください：\n\ncd ~/threads_bot\nexport META_APP_SECRET=シークレット\npython3 get_threads_token.py bemolle"}]}'

      - name: LINE通知（予期せぬエラー）
        if: failure() && steps.post.outputs.exit_code != '3'
        run: |
          SLOT="${{ steps.slot.outputs.name }}"
          EC="${{ steps.post.outputs.exit_code }}"
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ ベモーレThreads エラー停止\n\nスロット: ${SLOT}\n終了コード: ${EC:-不明}\n\nhttps://github.com/AyaKuroki929/threads-bot/actions\"}]}"

      - name: 投稿ストック自動補充（残り3本以下で発動）
        if: steps.post.outcome == 'success' && steps.slot.outputs.dry != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 generate_posts.py bemolle

      - name: Commit state files
        if: steps.post.outcome == 'success' && steps.slot.outputs.dry != 'true'
        run: |
          git config user.email "bot@github-actions"
          git config user.name "threads-bot"
          git add used_posts.json last_run.json posts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no state changes"
          else
            git commit -m "state: ${{ steps.slot.outputs.name }} $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            push_ok=0
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
              git push && push_ok=1 && break || sleep 3
            done
            [ $push_ok -eq 0 ] && echo "::warning::git push failed after 3 retries"
          fi
