name: Threads Auto Post

on:
  schedule:
    # GitHub Actions の schedule は遅延・欠落することがあるので、各時刻5分刻みで複数発火させる。
    # 重複は last_run.json + already_posted_today() で防止する（最初の成功で記録され、以降は即skip）。
    # JST 7:00 = UTC 22:00 (前日)
    - cron: '0 22 * * *'
    - cron: '5 22 * * *'
    - cron: '15 22 * * *'
    - cron: '30 22 * * *'
    - cron: '50 22 * * *'
    # JST 12:00 = UTC 3:00
    - cron: '0 3 * * *'
    - cron: '5 3 * * *'
    - cron: '15 3 * * *'
    - cron: '30 3 * * *'
    - cron: '50 3 * * *'
    # JST 21:00 = UTC 12:00
    - cron: '0 12 * * *'
    - cron: '5 12 * * *'
    - cron: '15 12 * * *'
    - cron: '30 12 * * *'
    - cron: '50 12 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '時間帯'
        required: true
        type: choice
        options:
          - morning
          - noon
          - evening
      dry_run:
        description: 'dry-run（実際には投稿しない）'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Restore session.json from secret
        env:
          SESSION: ${{ secrets.THREADS_SESSION }}
        run: |
          printf '%s' "$SESSION" > session.json
          python3 -c "import json; json.load(open('session.json')); print('session.json valid')"

      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
            echo "dry=${{ github.event.inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            # cron schedule の "分 時" → slot を判定。重複は last_run.json で防止。
            case "${{ github.event.schedule }}" in
              "0 22 * * *"|"5 22 * * *"|"15 22 * * *"|"30 22 * * *"|"50 22 * * *") echo "name=morning" >> $GITHUB_OUTPUT ;;
              "0 3 * * *"|"5 3 * * *"|"15 3 * * *"|"30 3 * * *"|"50 3 * * *")     echo "name=noon"    >> $GITHUB_OUTPUT ;;
              "0 12 * * *"|"5 12 * * *"|"15 12 * * *"|"30 12 * * *"|"50 12 * * *") echo "name=evening" >> $GITHUB_OUTPUT ;;
            esac
            echo "dry=false" >> $GITHUB_OUTPUT
          fi
          echo "slot=$(cat $GITHUB_OUTPUT)"

      - name: Post to Threads
        run: |
          if [ "${{ steps.slot.outputs.dry }}" = "true" ]; then
            python3 post.py ${{ steps.slot.outputs.name }} --dry-run
          else
            python3 post.py ${{ steps.slot.outputs.name }}
          fi

      - name: Commit state files
        if: success() && steps.slot.outputs.dry != 'true'
        run: |
          git config user.email "bot@github-actions"
          git config user.name "threads-bot"
          git add used_posts.json last_run.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no state changes"
          else
            git commit -m "state: ${{ steps.slot.outputs.name }} $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push
          fi
