name: SaaS - プレビュー生成（投稿しない・コミットしない）

on:
  workflow_dispatch:
    inputs:
      salon_name:
        description: 'プレビューするサロン名（B2B/ローカル定義）'
        required: false
        default: 'urakata_san_official'

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install anthropic gspread google-auth
      - name: Generate preview (no commit, log only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 preview_gen.py "${{ github.event.inputs.salon_name }}"
