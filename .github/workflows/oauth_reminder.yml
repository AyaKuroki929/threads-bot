name: SaaS - OAuth未完了リマインダー

on:
  schedule:
    # GitHubのschedule実行は遅延・スキップがある（2026-07-09に10時実行がスキップされ再発防止）。
    # コードは冪等（送信済みは必ずスキップ）なので1日3回動かして取りこぼしを防ぐ。
    - cron: '0 1 * * *'   # 10:00 JST（本命）
    - cron: '0 4 * * *'   # 13:00 JST（バックアップ1）
    - cron: '0 7 * * *'   # 16:00 JST（バックアップ2）
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run OAuth reminder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          ADMIN_NOTIFY_LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
        run: python3 oauth_reminder.py

      - name: Commit reminder state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oauth_reminder_state.json
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "state: oauth 2回目リマインド送信記録 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase origin main
            sleep 2
          done
          exit 1

      - name: Notify LINE on failure
        if: failure()
        env:
          LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="🚨 とうこさんSaaS OAuthリマインダーワークフロー失敗\n\nログ確認：\n$RUN_URL"
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"$TEXT\"}]}"
