name: SaaS - セッション週次自動更新

on:
  schedule:
    - cron: '0 20 * * 0'   # 毎週日曜 AM5時(JST)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: セッション更新
        id: refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 refresh_sessions_saas.py 2>&1 | tee /tmp/refresh_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: LINE通知（セッション切れサロンあり）
        if: failure() || steps.refresh.outputs.exit_code == '1'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
        run: |
          FAILED=$(grep "要対応サロン:" /tmp/refresh_output.txt | sed 's/要対応サロン: //' || echo "不明")
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"to\":\"$LINE_ADMIN_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ とうこさん セッション切れ\n\n再ログインが必要なサロンがあります。\n\n${FAILED}\n\npython3 playwright_login_saas.py \\\"サロン名\\\" ユーザー名\"}]}"
