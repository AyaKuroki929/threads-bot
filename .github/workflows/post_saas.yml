name: SaaS - サロン自動投稿

on:
  schedule:
    # 正時の投稿は cron-job.org が担当（7:00/12:00/21:00 JST ぴったり）。
    # 下のGH cronは「正時の30分後」に走る予備。cron-job.orgが投稿済みならスキップされる。
    # （旧設定は18時狙い等で早すぎ→GitHub遅延で20時に投稿してしまう不具合があった）
    - cron: '30 22 * * *'  # 毎日 AM7:30(JST) - 朝投稿の予備
    - cron: '30 3 * * *'   # 毎日 PM12:30(JST) - 昼投稿の予備
    - cron: '30 12 * * *'  # 毎日 PM9:30(JST) - 夜投稿の予備
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿スロット（morning / noon / evening）'
        required: true
        default: 'morning'
      only_salon:
        description: '特定サロンのみ投稿（テスト/デモ用・空なら全サロン）'
        required: false
        default: ''

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "30 22 * * *") echo "slot=morning" >> $GITHUB_OUTPUT ;;
              "30 3 * * *")  echo "slot=noon"    >> $GITHUB_OUTPUT ;;
              "30 12 * * *") echo "slot=evening" >> $GITHUB_OUTPUT ;;
            esac
          else
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          fi

      - name: Threads投稿（公式API）
        id: post
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADMIN_NOTIFY_LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY_SALON: ${{ github.event.inputs.only_salon }}
        run: |
          set +e
          python3 post_saas.py ${{ steps.slot.outputs.slot }}
          ec=$?
          echo "exit_code=$ec" >> $GITHUB_OUTPUT
          exit $ec

      - name: LINE通知（トークン切れ・exit 3）
        if: failure() && steps.post.outputs.exit_code == '3'
        env:
          ADMIN_NOTIFY_LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $ADMIN_NOTIFY_LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"type":"text","text":"🔑 とうこさん トークン切れ\n\nいずれかのサロンのThreads APIトークンが無効です。\n\nGitHub Actionsのログでどのサロンか確認し、トークンを再取得してSupabaseに登録してください。\n\nhttps://github.com/AyaKuroki929/threads-bot/actions"}]}'

      - name: LINE通知（その他エラー）
        if: failure() && steps.post.outputs.exit_code != '3'
        env:
          ADMIN_NOTIFY_LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
        run: |
          SLOT="${{ steps.slot.outputs.slot }}"
          EC="${{ steps.post.outputs.exit_code }}"
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $ADMIN_NOTIFY_LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ とうこさん 投稿エラー\n\nスロット: ${SLOT}\n終了コード: ${EC:-不明}\n\nhttps://github.com/AyaKuroki929/threads-bot/actions\"}]}"
