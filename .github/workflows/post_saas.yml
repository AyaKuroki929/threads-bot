name: SaaS - サロン自動投稿

on:
  schedule:
    # 正時の投稿は cron-job.org が担当（7:00/12:00/21:00 JST ぴったり）。
    # 下のGH cronは「正時の30分後」に走る予備。cron-job.orgが投稿済みならスキップされる。
    # （旧設定は18時狙い等で早すぎ→GitHub遅延で20時に投稿してしまう不具合があった）
    - cron: '30 22 * * *'  # 毎日 AM7:30(JST) - 朝投稿の予備
    - cron: '30 3 * * *'   # 毎日 PM12:30(JST) - 昼投稿の予備
    - cron: '30 12 * * *'  # 毎日 PM9:30(JST) - 夜投稿の予備
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿スロット（morning / noon / evening）'
        required: true
        default: 'morning'
      only_salon:
        description: '特定サロンのみ投稿（テスト/デモ用・空なら全サロン）'
        required: false
        default: ''
      dry_run:
        description: 'dry-run（プール読込のみ確認・投稿しない）'
        type: boolean
        default: false

concurrency:
  group: post-saas
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 投稿(最大8分)＋補充(2アカ×最大2分)＋通知・保存の余裕（2026-09-21 Sol指摘）
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 第三者クライアントの投稿プールは private リポ saas-posts に隔離（公開リポに顧客ファイルを置かない）。
      # 実行時にここへ取得して posts_saas/ に重ねる＝post_saas.py の読込ロジックは不変。
      # continue-on-error 必須：private取得が失敗しても投稿ジョブは止めない。
      # 公開リポにクライアントファイルが残っている間はそれがフォールバックになる。
      - name: クライアント投稿プールを private から取得
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: AyaKuroki929/saas-posts
          ssh-key: ${{ secrets.SAAS_POSTS_DEPLOY_KEY }}
          path: .saas_posts_private

      - name: private投稿プールを posts_saas/ に重ねる
        continue-on-error: true
        run: |
          mkdir -p posts_saas
          cp .saas_posts_private/posts_*.json posts_saas/ 2>/dev/null || true
          echo "posts_saas/ 合計 $(ls posts_saas/*.json 2>/dev/null | wc -l | tr -d ' ') ファイル（うちprivate $(ls .saas_posts_private/posts_*.json 2>/dev/null | wc -l | tr -d ' ') 件を重ね済み）"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "30 22 * * *") echo "slot=morning" >> $GITHUB_OUTPUT ;;
              "30 3 * * *")  echo "slot=noon"    >> $GITHUB_OUTPUT ;;
              "30 12 * * *") echo "slot=evening" >> $GITHUB_OUTPUT ;;
            esac
          else
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: pip install -q "anthropic<2"

      - name: Threads投稿（公式API）
        id: post
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADMIN_NOTIFY_LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY_SALON: ${{ github.event.inputs.only_salon }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          set +e
          python3 post_saas.py ${{ steps.slot.outputs.slot }}
          ec=$?
          echo "exit_code=$ec" >> $GITHUB_OUTPUT
          exit $ec

      # トークン切れ(exit3)・サロン別エラーは post_saas.py 内がアカウント名付きで
      # LINE通知済み（.line_notified が置かれる）。ここは「Python到達前のインフラ層
      # 失敗」だけを拾う保険（1障害＝複数broadcastの浪費を防ぐ）。
      - name: LINE通知（インフラ層の失敗のみ）
        if: failure() || cancelled()  # timeout超過はcancelled扱いでfailure()に掛からない（実機検証済み）
        env:
          ADMIN_NOTIFY_LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -f .line_notified ] || [ "${{ env.line_notified }}" = "1" ]; then echo "Python側で通知済み → スキップ"; exit 0; fi
          SLOT="${{ steps.slot.outputs.slot }}"
          EC="${{ steps.post.outputs.exit_code }}"
          code=$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $ADMIN_NOTIFY_LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ SaaS Threads 投稿エラー\n\nスロット: ${SLOT}\n終了コード: ${EC:-不明}\n\nhttps://github.com/AyaKuroki929/threads-bot/actions\"}]}" ) || code=000; [ "$code" = "200" ] || echo "::error::LINE通知の送信に失敗（HTTP $code）"

      # 自アカ(bemolle/個人)が投稿できていればping。クライアント1件の失敗で
      # pingが欠落し deadman worker が「GH Actions障害」と誤報するのを防ぐため、
      # ジョブ成否ではなく post_saas.py が置く hc_ok マーカーで判定する。
      - name: Healthcheck ping（自アカ投稿成功の証明）
        if: ${{ !cancelled() }}
        env:
          HC_MORNING: ${{ secrets.HC_PING_URL_MORNING }}
          HC_NOON: ${{ secrets.HC_PING_URL_NOON }}
          HC_EVENING: ${{ secrets.HC_PING_URL_EVENING }}
        run: |
          if [ ! -f hc_ok ]; then echo "自アカ失敗のためHC pingスキップ"; exit 0; fi
          case "${{ steps.slot.outputs.slot }}" in
            morning) URL="$HC_MORNING" ;;
            noon)    URL="$HC_NOON" ;;
            evening) URL="$HC_EVENING" ;;
          esac
          [ -n "$URL" ] && curl -sS --retry 3 "$URL" || true

      # 補充より先に「投稿済み」の記録だけ保存する。補充が時間切れ・失敗しても
      # 成功済み投稿の last_run が消えず、heartbeatの誤リカバリ(二重投稿)を防ぐ（2026-09-21 Sol指摘）
      - name: 投稿状態を先に保存（last_run）
        if: ${{ !cancelled() }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
        run: |
          git config user.email "bot@github-actions"
          git config user.name "threads-bot"
          git pull --rebase --autostash origin main 2>&1 || true
          git add last_run.json last_run_personal.json promo_used_personal.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no last_run changes"
          else
            git commit -m "state: last_run ${{ steps.slot.outputs.slot }} $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            ok=""
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin main 2>&1 || true
              if git push; then ok=1; break; fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              code=$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" -X POST https://api.line.me/v2/bot/message/broadcast \
                -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"messages":[{"type":"text","text":"🚨 SaaS投稿: last_runのpush 3回失敗。heartbeatの誤リカバリ(二重投稿)の恐れ。Actionsを確認してください。"}]}' ) || code=000; [ "$code" = "200" ] || echo "::error::LINE通知の送信に失敗（HTTP $code）"
              touch .line_notified
              exit 1
            fi
          fi

      # ⚠️ continue-on-error と `|| echo` で異常終了を握りつぶしていたため、
      # 補充が止まっても誰も気づかなかった（2026-09-13 Sol指摘）。
      # 片方が落ちても両方走らせるが、落ちたことは必ず残して最後にLINEで知らせる。
      # pip失敗・時間切れも「失敗」として通知に乗せる（2026-09-21 Sol指摘：pip失敗が無通知で緑だった）
      - name: 投稿ストック自動補充（ベモーレ・個人）
        id: refill
        if: success()
        continue-on-error: true
        timeout-minutes: 6
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REFILL_DEADLINE_SEC: "120"   # 1アカウントあたりの生成期限（Python側で打ち切り→異常終了）
        run: |
          failed=""
          python3 -c "import anthropic" 2>/dev/null || pip install -q "anthropic<2" || failed="$failed pip"
          if [ -z "$failed" ]; then
            python3 generate_posts.py saas_bemolle  || failed="$failed bemolle"
            python3 generate_posts.py saas_personal || failed="$failed personal"
          fi
          if [ -n "$failed" ]; then
            echo "refill_failed=$failed" >> "$GITHUB_ENV"
            echo "::warning::投稿ストックの補充に失敗:$failed"
            exit 1
          fi

      # 補充ステップが「失敗フラグを立てずに死んだ」場合（時間切れ・想定外の異常終了）も拾う
      - name: 補充失敗を知らせる
        if: ${{ !cancelled() && (env.refill_failed != '' || steps.refill.outcome == 'failure') }}
        env:
          LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
          REFILL_FAILED: ${{ env.refill_failed }}
          REFILL_OUTCOME: ${{ steps.refill.outcome }}
        run: |
          TARGET="${REFILL_FAILED:-（不明：ステップが $REFILL_OUTCOME で終了＝時間切れ等）}"
          MSG="⚠️ 投稿ストックの補充に失敗しました\n\n対象:${TARGET}\n\nこのままだと在庫が尽きて同じ投稿が再利用されます。\nGitHub Actions（post_saas）のログを確認してください。"
          if [ -z "$LINE_TOKEN" ]; then
            echo "::error::LINEトークン未設定のため補充失敗を通知できません（対象:${TARGET}）"
            exit 1
          fi
          sent=""
          for i in 1 2 3; do
            code=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" -X POST https://api.line.me/v2/bot/message/broadcast \
              -H "Authorization: Bearer $LINE_TOKEN" -H "Content-Type: application/json" \
              -d "{\"messages\":[{\"type\":\"text\",\"text\":\"$MSG\"}]}") || code=000
            if [ "$code" = "200" ]; then sent=1; break; fi
            echo "LINE送信失敗 HTTP $code（$i/3）"; sleep 5
          done
          [ -n "$sent" ] || echo "::error::補充失敗のLINE通知が届きませんでした（対象:${TARGET}）"
          exit 1   # 補充失敗はジョブを赤くして残す（保存ステップは !cancelled() なので走る）

      # if: success() だと、クライアント1件の失敗で成功済みアカウントの last_run が
      # pushされず、heartbeatが「未投稿」と誤判定して旧プールから二重投稿していた。
      # 失敗時も必ず走らせて last_run を保存する。
      - name: Commit posts files（補充分の保存）
        if: ${{ !cancelled() }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
        run: |
          git config user.email "bot@github-actions"
          git config user.name "threads-bot"
          git pull --rebase --autostash origin main 2>&1 || true
          git add posts_saas/posts_bemolle_diet.json posts_saas/posts_aya_kuroki_0929.json last_run.json last_run_personal.json promo_used_personal.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no generate changes"
          else
            git commit -m "state: posts補充 ${{ steps.slot.outputs.slot }} $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            # rebase中は ours/theirs が反転する: ローカルのstateを守るのは -X theirs
            ok=""
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin main 2>&1 || true
              if git push; then ok=1; break; fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              # push失敗=last_runが古いまま→heartbeatが「未投稿」と誤判定し再投稿する重大事象
              code=$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" -X POST https://api.line.me/v2/bot/message/broadcast \
                -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"messages":[{"type":"text","text":"🚨 SaaS投稿: 状態push 3回失敗。heartbeatの誤リカバリ(二重投稿)の恐れ。Actionsを確認してください。"}]}' ) || code=000; [ "$code" = "200" ] || echo "::error::LINE通知の送信に失敗（HTTP $code）"
              touch .line_notified  # failure() 汎用通知と二重送信しないための印
              exit 1
            fi
          fi
