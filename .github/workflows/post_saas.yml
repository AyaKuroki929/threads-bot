name: SaaS - サロン自動投稿

on:
  schedule:
    - cron: '0 0 * * *'    # 毎日 AM9時(JST) - 朝投稿
    - cron: '0 11 * * *'   # 毎日 PM8時(JST) - 夜投稿
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿スロット（morning / evening）'
        required: true
        default: 'morning'

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if echo "${{ github.event.schedule }}" | grep -q "0 0"; then
              echo "slot=morning" >> $GITHUB_OUTPUT
            else
              echo "slot=evening" >> $GITHUB_OUTPUT
            fi
          else
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          fi

      - name: Threads投稿（公式API）
        id: post
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set +e
          python3 post_saas.py ${{ steps.slot.outputs.slot }}
          ec=$?
          echo "exit_code=$ec" >> $GITHUB_OUTPUT
          exit $ec

      - name: LINE通知（トークン切れ・exit 3）
        if: failure() && steps.post.outputs.exit_code == '3'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"type":"text","text":"🔑 とうこさん トークン切れ\n\nいずれかのサロンのThreads APIトークンが無効です。\n\nGitHub Actionsのログでどのサロンか確認し、トークンを再取得してSupabaseに登録してください。\n\nhttps://github.com/AyaKuroki929/threads-bot/actions"}]}'

      - name: LINE通知（その他エラー）
        if: failure() && steps.post.outputs.exit_code != '3'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          SLOT="${{ steps.slot.outputs.slot }}"
          EC="${{ steps.post.outputs.exit_code }}"
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ とうこさん 投稿エラー\n\nスロット: ${SLOT}\n終了コード: ${EC:-不明}\n\nhttps://github.com/AyaKuroki929/threads-bot/actions\"}]}"
