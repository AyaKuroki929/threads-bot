name: SaaS - サロン自動投稿

on:
  schedule:
    - cron: '0 0 * * *'    # 毎日 AM9時(JST) - 朝投稿
    - cron: '0 11 * * *'   # 毎日 PM8時(JST) - 夜投稿
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿スロット（morning / evening）'
        required: true
        default: 'morning'

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if echo "${{ github.event.schedule }}" | grep -q "0 0"; then
              echo "slot=morning" >> $GITHUB_OUTPUT
            else
              echo "slot=evening" >> $GITHUB_OUTPUT
            fi
          else
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          fi

      - name: Threads投稿（公式API）
        id: post
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 post_saas.py ${{ steps.slot.outputs.slot }}

      - name: LINE通知（投稿失敗時）
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"to\":\"$LINE_ADMIN_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"❌ とうこさん 投稿失敗\n\nスロット: ${{ steps.slot.outputs.slot }}\n\nGitHub Actionsを確認してください。\nhttps://github.com/AyaKuroki929/threads-bot/actions\"}]}"
