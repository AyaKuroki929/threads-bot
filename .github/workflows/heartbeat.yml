name: Heartbeat - Verify Post Success

on:
  schedule:
    - cron: '0 2 * * *'    # JST 11:00 morning確認
    - cron: '0 7 * * *'    # JST 16:00 noon確認
    - cron: '0 14 * * *'   # JST 23:00 evening確認
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Tokyo
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine expected slot (cron-schedule-based + valid-hour guard)
        id: slot
        run: |
          # cron schedule文字列から本来チェックすべきslotを決定（現在時刻ベースだと遅延発火で誤判定する）
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HOUR_JST=$(TZ=Asia/Tokyo date '+%-H')
            if [ "$HOUR_JST" -ge 8 ] && [ "$HOUR_JST" -lt 13 ]; then
              SLOT="morning"
            elif [ "$HOUR_JST" -ge 13 ] && [ "$HOUR_JST" -lt 22 ]; then
              SLOT="noon"
            else
              SLOT="evening"
            fi
            VALID_START=0; VALID_END=24
          else
            case "${{ github.event.schedule }}" in
              "0 2 * * *")  SLOT="morning"; VALID_START=5;  VALID_END=13 ;;
              "0 7 * * *")  SLOT="noon";    VALID_START=11; VALID_END=19 ;;
              "0 14 * * *") SLOT="evening"; VALID_START=17; VALID_END=24 ;;
              *) SLOT="morning"; VALID_START=0; VALID_END=24 ;;
            esac
          fi
          HOUR_JST=$(TZ=Asia/Tokyo date '+%-H')
          if [ "$HOUR_JST" -lt "$VALID_START" ] || [ "$HOUR_JST" -ge "$VALID_END" ]; then
            echo "[skip] heartbeat fired outside $SLOT valid window (now=${HOUR_JST}h, valid=${VALID_START}-${VALID_END}h)"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
          echo "name=$SLOT" >> $GITHUB_OUTPUT
          echo "today=$(TZ=Asia/Tokyo date '+%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "now=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')" >> $GITHUB_OUTPUT

      - name: Verify last_run.json
        if: steps.slot.outputs.skip != 'true'
        id: verify
        run: |
          SLOT="${{ steps.slot.outputs.name }}"
          TODAY="${{ steps.slot.outputs.today }}"
          if [ ! -f last_run.json ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "reason=last_run.json not found" >> $GITHUB_OUTPUT
            exit 0
          fi
          LAST=$(python3 -c "import json; print(json.load(open('last_run.json')).get('$SLOT', ''))")
          echo "[heartbeat] $SLOT today=$TODAY last_recorded=$LAST"
          if [[ "$LAST" == "$TODAY"* ]]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "reason=last $SLOT recorded: '$LAST', expected today=$TODAY" >> $GITHUB_OUTPUT
          fi

      - name: Auto-recovery - trigger post.yml if missing
        if: steps.slot.outputs.skip != 'true' && steps.verify.outputs.ok != 'true'
        id: recovery
        uses: actions/github-script@v7
        with:
          script: |
            const slot = '${{ steps.slot.outputs.name }}'
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'post.yml',
                ref: 'main',
                inputs: { slot: slot, dry_run: 'false' }
              })
              console.log(`[recovery] post.yml triggered for ${slot}`)
              core.setOutput('triggered', 'true')
            } catch (e) {
              console.log(`[recovery] trigger failed: ${e.message}`)
              core.setOutput('triggered', 'false')
              core.setOutput('error', e.message)
            }

      - name: Find existing open alert issue for today's slot
        if: steps.slot.outputs.skip != 'true' && steps.verify.outputs.ok != 'true' && steps.recovery.outputs.triggered != 'true'
        id: existing
        uses: actions/github-script@v7
        with:
          script: |
            const slot = '${{ steps.slot.outputs.name }}'
            const today = '${{ steps.slot.outputs.today }}'
            const title_marker = `[${today}] ${slot}`
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50
            })
            const found = issues.data.find(i => i.title.includes(title_marker))
            core.setOutput('exists', found ? 'true' : 'false')

      - name: Create alert issue (only when recovery trigger itself failed)
        if: steps.slot.outputs.skip != 'true' && steps.verify.outputs.ok != 'true' && steps.recovery.outputs.triggered != 'true' && steps.existing.outputs.exists != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const slot = '${{ steps.slot.outputs.name }}'
            const today = '${{ steps.slot.outputs.today }}'
            const now = '${{ steps.slot.outputs.now }}'
            const reason = `${{ steps.verify.outputs.reason }}`
            const recovery_err = `${{ steps.recovery.outputs.error }}`
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 [${today}] ${slot} 投稿未確認 + 自動リカバリ失敗 (heartbeat at ${now})`,
              body: [
                `Heartbeatが本日の **${slot}** 投稿の成功記録を見つけられず、`,
                `自動リカバリ（post.yml の workflow_dispatch トリガー）も失敗しました。`,
                ``,
                `- 確認時刻: ${now}`,
                `- 期待スロット: ${slot}`,
                `- 検出理由: ${reason}`,
                `- リカバリ失敗理由: ${recovery_err}`,
                ``,
                `## 対応`,
                `下記コマンドで手動投稿できます（Macのターミナルで実行）:`,
                `\`\`\``,
                `gh workflow run post.yml -f slot=${slot} -f dry_run=false`,
                `\`\`\``,
                ``,
                `投稿が出たことを確認したら、このIssueをcloseしてください。`,
              ].join('\n'),
              labels: ['heartbeat-alert']
            })

      - name: Verify last_run_personal.json
        if: steps.slot.outputs.skip != 'true'
        id: verify_personal
        run: |
          SLOT="${{ steps.slot.outputs.name }}"
          TODAY="${{ steps.slot.outputs.today }}"
          if [ ! -f last_run_personal.json ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "reason=last_run_personal.json not found" >> $GITHUB_OUTPUT
            exit 0
          fi
          LAST=$(python3 -c "import json; print(json.load(open('last_run_personal.json')).get('$SLOT', ''))")
          echo "[heartbeat-personal] $SLOT today=$TODAY last_recorded=$LAST"
          if [[ "$LAST" == "$TODAY"* ]]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "reason=last personal $SLOT recorded: '$LAST', expected today=$TODAY" >> $GITHUB_OUTPUT
          fi

      - name: Auto-recovery (personal) - trigger post_personal.yml if missing
        if: steps.slot.outputs.skip != 'true' && steps.verify_personal.outputs.ok != 'true'
        id: recovery_personal
        uses: actions/github-script@v7
        with:
          script: |
            const slot = '${{ steps.slot.outputs.name }}'
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'post_personal.yml',
                ref: 'main',
                inputs: { slot: slot, dry_run: 'false' }
              })
              console.log(`[recovery personal] post_personal.yml triggered for ${slot}`)
              core.setOutput('triggered', 'true')
            } catch (e) {
              console.log(`[recovery personal] trigger failed: ${e.message}`)
              core.setOutput('triggered', 'false')
              core.setOutput('error', e.message)
            }

      - name: LINE通知（heartbeat検知）
        if: |
          always() &&
          steps.slot.outputs.skip != 'true' &&
          (steps.verify.outputs.ok != 'true' || steps.verify_personal.outputs.ok != 'true')
        run: |
          MSG=""
          if [ "${{ steps.verify.outputs.ok }}" != "true" ]; then
            MSG="${MSG}⚠️ ベモーレ ${{ steps.slot.outputs.name }} 投稿未確認\n"
            if [ "${{ steps.recovery.outputs.triggered }}" = "true" ]; then
              MSG="${MSG}→ 自動リカバリ発動済み\n"
            else
              MSG="${MSG}→ リカバリ失敗（手動対応が必要）\n"
            fi
          fi
          if [ "${{ steps.verify_personal.outputs.ok }}" != "true" ]; then
            MSG="${MSG}⚠️ 個人 ${{ steps.slot.outputs.name }} 投稿未確認\n"
            if [ "${{ steps.recovery_personal.outputs.triggered }}" = "true" ]; then
              MSG="${MSG}→ 自動リカバリ発動済み\n"
            else
              MSG="${MSG}→ リカバリ失敗（手動対応が必要）\n"
            fi
          fi
          MSG="${MSG}\nhttps://github.com/AyaKuroki929/threads-bot/actions"
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"${MSG}\"}]}"

      - name: Summary
        if: always()
        run: |
          echo "[heartbeat] slot=${{ steps.slot.outputs.name }} bemolle_ok=${{ steps.verify.outputs.ok }} personal_ok=${{ steps.verify_personal.outputs.ok }} recovery_bemolle=${{ steps.recovery.outputs.triggered }} recovery_personal=${{ steps.recovery_personal.outputs.triggered }}"
