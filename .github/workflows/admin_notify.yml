name: 管理者LINE通知（手動送信用）

# Claudeが手動対応（リマインド手動送信など）をした時に、彩さんへの完了通知を出すための汎用ワークフロー。
# 管理者トークンはGitHub Secretsにしか無いため、ローカルから通知を送る手段としてこれを使う。
on:
  workflow_dispatch:
    inputs:
      text:
        description: '送信する通知テキスト（\n で改行）'
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send admin LINE
        env:
          LINE_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
          TEXT: ${{ github.event.inputs.text }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          text = os.environ["TEXT"].replace("\\n", "\n")
          req = urllib.request.Request(
              "https://api.line.me/v2/bot/message/broadcast",
              data=json.dumps({"messages":[{"type":"text","text":text}]}).encode(),
              headers={"Authorization": f"Bearer {os.environ['LINE_TOKEN']}",
                       "Content-Type": "application/json"},
              method="POST")
          with urllib.request.urlopen(req, timeout=15) as r:
              print("HTTP", r.status)
          PY
