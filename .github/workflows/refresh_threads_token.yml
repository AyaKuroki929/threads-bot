name: Threads API - トークン週次更新

on:
  schedule:
    - cron: '0 1 * * 0'  # 毎週日曜 AM10:00 JST
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}

    steps:
      - name: Refresh THREADS_API_TOKEN_BEMOLLE
        id: bemolle
        env:
          TOKEN: ${{ secrets.THREADS_API_TOKEN_BEMOLLE }}
        run: |
          set +e
          NEW_TOKEN=$(python3 -c "
          import urllib.request, json, urllib.parse, sys, os
          token = os.environ['TOKEN']
          if not token:
              print('TOKEN が空です', file=sys.stderr)
              sys.exit(1)
          url = 'https://graph.threads.net/v1.0/refresh_access_token?grant_type=th_refresh_token&access_token=' + urllib.parse.quote(token)
          try:
              with urllib.request.urlopen(url, timeout=30) as resp:
                  d = json.loads(resp.read())
                  expires = d.get('expires_in', 0) // 86400
                  print(f'[bemolle] リフレッシュ成功（有効期間 {expires}日）', file=sys.stderr)
                  print(d['access_token'])
          except Exception as e:
              print(f'[bemolle] リフレッシュ失敗: {e}', file=sys.stderr)
              sys.exit(1)
          ")
          refresh_ec=$?
          if [ $refresh_ec -ne 0 ] || [ -z "$NEW_TOKEN" ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
          else
            printf "%s" "$NEW_TOKEN" | gh secret set THREADS_API_TOKEN_BEMOLLE --repo ${{ github.repository }}
            if [ $? -eq 0 ]; then
              echo "ok=true" >> $GITHUB_OUTPUT
              echo "[bemolle] GH Secretsを更新しました"
              # instagram-stories-bemolle（Threads→ストーリー化）にも同じトークンを同期
              printf "%s" "$NEW_TOKEN" | gh secret set THREADS_API_TOKEN_BEMOLLE --repo AyaKuroki929/instagram-stories-bemolle \
                && echo "[bemolle] instagram-stories-bemolle にも同期しました" \
                || echo "[bemolle] instagram-stories-bemolle 同期失敗（PAT権限を確認）" >&2
            else
              echo "ok=false" >> $GITHUB_OUTPUT
              echo "[bemolle] GH Secrets更新失敗" >&2
            fi
          fi

      - name: Refresh THREADS_API_TOKEN_PERSONAL
        id: personal
        env:
          TOKEN: ${{ secrets.THREADS_API_TOKEN_PERSONAL }}
        run: |
          set +e
          NEW_TOKEN=$(python3 -c "
          import urllib.request, json, urllib.parse, sys, os
          token = os.environ['TOKEN']
          if not token:
              print('TOKEN が空です', file=sys.stderr)
              sys.exit(1)
          url = 'https://graph.threads.net/v1.0/refresh_access_token?grant_type=th_refresh_token&access_token=' + urllib.parse.quote(token)
          try:
              with urllib.request.urlopen(url, timeout=30) as resp:
                  d = json.loads(resp.read())
                  expires = d.get('expires_in', 0) // 86400
                  print(f'[personal] リフレッシュ成功（有効期間 {expires}日）', file=sys.stderr)
                  print(d['access_token'])
          except Exception as e:
              print(f'[personal] リフレッシュ失敗: {e}', file=sys.stderr)
              sys.exit(1)
          ")
          refresh_ec=$?
          if [ $refresh_ec -ne 0 ] || [ -z "$NEW_TOKEN" ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
          else
            printf "%s" "$NEW_TOKEN" | gh secret set THREADS_API_TOKEN_PERSONAL --repo ${{ github.repository }}
            if [ $? -eq 0 ]; then
              echo "ok=true" >> $GITHUB_OUTPUT
              echo "[personal] GH Secretsを更新しました"
            else
              echo "ok=false" >> $GITHUB_OUTPUT
              echo "[personal] GH Secrets更新失敗" >&2
            fi
          fi

      - name: Refresh SaaS ユーザートークン（Supabase全件）
        id: saas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.ADMIN_NOTIFY_LINE_TOKEN }}
        run: |
          set +e
          python3 - <<'PYEOF'
          import urllib.request, urllib.parse, json, os, sys

          SUPABASE_URL = os.environ.get("SUPABASE_URL", "")
          SUPABASE_KEY = os.environ.get("SUPABASE_SERVICE_KEY", "")
          LINE_TOKEN   = os.environ.get("LINE_CHANNEL_ACCESS_TOKEN", "")

          if not SUPABASE_URL or not SUPABASE_KEY:
              print("[saas] SUPABASE_URL/SERVICE_KEY 未設定 → スキップ")
              sys.exit(0)

          url = f"{SUPABASE_URL}/rest/v1/salons?is_active=eq.true&select=id,salon_name,access_token&access_token=neq.null"
          req = urllib.request.Request(url, headers={
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}",
          })
          with urllib.request.urlopen(req, timeout=30) as resp:
              salons = json.loads(resp.read())

          if not salons:
              print("[saas] アクティブサロンなし → スキップ")
              sys.exit(0)

          failures = []
          for salon in salons:
              salon_id   = salon["id"]
              name       = salon["salon_name"]
              old_token  = salon.get("access_token", "")
              if not old_token:
                  print(f"[saas] {name}: access_token 未設定 → スキップ")
                  continue

              refresh_url = (
                  "https://graph.threads.net/v1.0/refresh_access_token"
                  f"?grant_type=th_refresh_token&access_token={urllib.parse.quote(old_token)}"
              )
              try:
                  with urllib.request.urlopen(refresh_url, timeout=30) as r:
                      d = json.loads(r.read())
                  new_token = d["access_token"]
                  expires   = d.get("expires_in", 0) // 86400

                  patch_url = f"{SUPABASE_URL}/rest/v1/salons?id=eq.{salon_id}"
                  patch_data = json.dumps({"access_token": new_token}).encode()
                  patch_req = urllib.request.Request(patch_url, data=patch_data, method="PATCH", headers={
                      "apikey": SUPABASE_KEY,
                      "Authorization": f"Bearer {SUPABASE_KEY}",
                      "Content-Type": "application/json",
                      "Prefer": "return=minimal",
                  })
                  urllib.request.urlopen(patch_req, timeout=30)
                  print(f"[saas] {name}: リフレッシュ成功（{expires}日）")
              except Exception as e:
                  print(f"[saas] {name}: リフレッシュ失敗 - {e}")
                  failures.append(name)

          if failures:
              if LINE_TOKEN:
                  names = ", ".join(failures)
                  msg = f"⚠️ SaaSトークン更新失敗\n\n対象サロン: {names}\n\n手動で再取得・登録が必要です"
                  body = json.dumps({"messages": [{"type": "text", "text": msg}]}).encode()
                  req = urllib.request.Request(
                      "https://api.line.me/v2/bot/message/broadcast",
                      data=body, method="POST",
                      headers={"Authorization": f"Bearer {LINE_TOKEN}", "Content-Type": "application/json"}
                  )
                  urllib.request.urlopen(req, timeout=15)
              sys.exit(1)
          PYEOF

      - name: LINE通知（失敗時）
        if: steps.bemolle.outputs.ok == 'false' || steps.personal.outputs.ok == 'false'
        run: |
          MSG="⚠️ Threadsトークン週次更新失敗\n\n"
          [ "${{ steps.bemolle.outputs.ok }}" = "false" ] && MSG="${MSG}❌ bemolle_diet トークン更新失敗\n"
          [ "${{ steps.personal.outputs.ok }}" = "false" ] && MSG="${MSG}❌ aya_kuroki_0929 トークン更新失敗\n"
          MSG="${MSG}\n来週また自動で再試行されます。\n60日以内に成功すれば問題ありません。"
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"${MSG}\"}]}"
