name: Threads Personal Auto Post

on:
  schedule:
    # JST 7:30 = UTC 22:30 (前日)
    - cron: '30 22 * * *'
    - cron: '0 23 * * *'
    # JST 22:00 = UTC 13:00
    - cron: '0 13 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '時間帯'
        required: true
        type: choice
        options:
          - morning
          - evening
      dry_run:
        description: 'dry-run（実際には投稿しない）'
        type: boolean
        default: true

concurrency:
  group: threads-personal-${{ (contains(github.event.schedule, ' 22 ') || contains(github.event.schedule, ' 23 ')) && 'morning' || contains(github.event.schedule, ' 13 ') && 'evening' || github.event.inputs.slot || 'manual' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    env:
      TZ: Asia/Tokyo
      THREADS_USERNAME: aya_kuroki_0929
      POSTS_FILE: posts_personal.json
      SESSION_FILE: session_personal.json
      USED_FILE: used_posts_personal.json
      LAST_RUN_FILE: last_run_personal.json
      PRIORITY_FILE: priority_posts_personal.json
      COMMENT_TARGETS_FILE: comment_targets_personal.json
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine slot + dry_run
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
            echo "dry=${{ github.event.inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "30 22 * * *"|"0 23 * * *") echo "name=morning" >> $GITHUB_OUTPUT ;;
              "0 13 * * *"|"30 13 * * *") echo "name=evening" >> $GITHUB_OUTPUT ;;
            esac
            echo "dry=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Restore session_personal.json from secret
        env:
          SESSION: ${{ secrets.THREADS_SESSION_PERSONAL }}
        run: |
          printf '%s' "$SESSION" > session_personal.json
          python3 -c "import json; json.load(open('session_personal.json')); print('session_personal.json valid')"

      - name: Post to Threads (personal)
        id: post
        run: |
          set +e
          if [ "${{ steps.params.outputs.dry }}" = "true" ]; then
            python3 post.py ${{ steps.params.outputs.name }} --dry-run
          else
            python3 post.py ${{ steps.params.outputs.name }}
          fi
          ec=$?
          echo "exit_code=$ec" >> $GITHUB_OUTPUT
          exit $ec

      - name: Create Cookie-Expired alert (only on exit code 3)
        if: failure() && steps.post.outputs.exit_code == '3'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toLocaleDateString('ja-JP', {timeZone: 'Asia/Tokyo'})
            const slot = '${{ steps.params.outputs.name }}'
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cookie-expired-personal',
              per_page: 5
            })
            if (existing.data.length > 0) {
              console.log('cookie-expired-personal Issue 既存のためskip:', existing.data[0].html_url)
              return
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔑 個人Threads ログイン切れ - cookie再発行が必要 (${today})`,
              body: [
                `個人アカウント(@aya_kuroki_0929)のThreads自動投稿が **ログイン切れ** で停止しました（${today} ${slot}）。`,
                ``,
                `## やること（Macのターミナルで）`,
                `\`\`\`bash`,
                `cd ~/threads_bot`,
                `python3 extract_cookies2.py`,
                `# → 個人アカウント(aya_kuroki_0929)でログインした状態で実行`,
                `cp session.json session_personal.json`,
                `gh secret set THREADS_SESSION_PERSONAL < session_personal.json`,
                `\`\`\``,
                ``,
                `対応完了したらこのIssueをcloseしてください。`,
              ].join('\n'),
              labels: ['cookie-expired-personal']
            })

      - name: Commit state files
        if: success() && steps.params.outputs.dry != 'true'
        run: |
          git config user.email "bot@github-actions"
          git config user.name "threads-bot-personal"
          git add used_posts_personal.json last_run_personal.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no state changes"
          else
            git commit -m "state_personal: ${{ steps.params.outputs.name }} $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push
          fi
