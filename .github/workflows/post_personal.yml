name: Threads Personal Auto Post (aya)

on:
  schedule:
    # 朝のみGH Actions（Mac未起動対策）。昼・夜はMac LaunchAgent。
    - cron: '30 22 * * *'  # JST 7:30
  workflow_dispatch:
    inputs:
      slot:
        description: '時間帯'
        required: true
        type: choice
        options:
          - morning
          - noon
          - evening
      dry_run:
        description: 'dry-run（実際には投稿しない）'
        type: boolean
        default: true

concurrency:
  group: threads-personal-${{ (contains(github.event.schedule, ' 22 ') || contains(github.event.schedule, ' 23 ')) && 'morning' || contains(github.event.schedule, ' 3 ') && 'noon' || contains(github.event.schedule, ' 12 ') && 'evening' || github.event.inputs.slot || 'manual' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    env:
      TZ: Asia/Tokyo
      THREADS_USERNAME: aya_kuroki_0929
      POSTS_FILE: posts_personal.json
      SESSION_FILE: session_personal.json
      USED_FILE: used_posts_personal.json
      LAST_RUN_FILE: last_run_personal.json
      PRIORITY_FILE: priority_posts_personal.json
      COMMENT_TARGETS_FILE: comment_targets_personal.json
      THREADS_TOPIC: ビジネス＆起業家
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      AUTO_COMMENT: '1'
      MAX_COMMENTS_PER_RUN: '3'
      COMMENTED_FILE: commented_posts_personal.json
      COMMENT_MIN_POOL: '5'
      COMMENT_KEYWORDS_FILE: comment_search_keywords_personal.json
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EXPECTED_USER_ID: '63084943935'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine slot + dry_run
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
            echo "dry=${{ github.event.inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "30 22 * * *"|"0 23 * * *") echo "name=morning" >> $GITHUB_OUTPUT ;;
              "0 3 * * *"|"30 3 * * *")   echo "name=noon"    >> $GITHUB_OUTPUT ;;
              "0 12 * * *"|"30 12 * * *") echo "name=evening" >> $GITHUB_OUTPUT ;;
            esac
            echo "dry=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install --upgrade pip
          pip install playwright anthropic
          python -m playwright install --with-deps chromium

      - name: Restore session_personal.json from secret
        env:
          SESSION: ${{ secrets.THREADS_SESSION_PERSONAL }}
        run: |
          printf '%s' "$SESSION" > session_personal.json
          python3 -c "import json; json.load(open('session_personal.json')); print('session_personal.json valid')"

      - name: Random delay (human-like timing)
        if: steps.params.outputs.dry != 'true'
        run: |
          delay=$((RANDOM % 300))
          echo "投稿まで ${delay}秒 待機（ランダム遅延）"
          sleep $delay

      - name: Pull latest state (重複投稿防止)
        if: steps.params.outputs.dry != 'true'
        run: |
          git config user.email "bot@github-actions"
          git config user.name "threads-bot-personal"
          git pull --rebase origin main 2>&1 || true

      - name: Post to Threads (personal)
        id: post
        env:
          # 手動実行時は時間帯チェックをスキップ（テスト・補完用）
          SKIP_TIME_GUARD: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          set +e
          if [ "${{ steps.params.outputs.dry }}" = "true" ]; then
            python3 post.py ${{ steps.params.outputs.name }} --dry-run
          else
            python3 post.py ${{ steps.params.outputs.name }}
          fi
          ec=$?
          echo "exit_code=$ec" >> $GITHUB_OUTPUT
          exit $ec

      - name: Upload debug screenshot (exit code 2 only)
        if: failure() && steps.post.outputs.exit_code == '2'
        uses: actions/upload-artifact@v4
        with:
          name: composer-fail-screenshot
          path: /tmp/composer_fail.png
          if-no-files-found: ignore

      - name: Create Account-Mismatch alert (only on exit code 4)
        id: alert_mismatch
        if: failure() && steps.post.outputs.exit_code == '4'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toLocaleDateString('ja-JP', {timeZone: 'Asia/Tokyo'})
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'account-mismatch-personal',
              per_page: 5
            })
            if (existing.data.length > 0) {
              console.log('account-mismatch-personal Issue 既存のためskip:', existing.data[0].html_url)
              core.setOutput('created', 'false')
              return
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 個人Threads アカウント不一致 - セッション要確認 (${today})`,
              body: [
                `個人アカウント(@aya_kuroki_0929)の自動投稿が **アカウント不一致** で停止しました（${today}）。`,
                ``,
                `THREADS_SESSION_PERSONAL シークレットが @aya_kuroki_0929 のセッションではない可能性があります。`,
                ``,
                `## やること（Macのターミナルで）`,
                `\`\`\`bash`,
                `cd ~/threads_bot`,
                `python3 extract_cookies2.py --profile 1`,
                `gh secret set THREADS_SESSION_PERSONAL < session.json`,
                `\`\`\``,
                ``,
                `対応完了したらこのIssueをcloseしてください。`,
              ].join('\n'),
              labels: ['account-mismatch-personal']
            })
            core.setOutput('created', 'true')

      - name: LINE通知（個人アカウント不一致）
        if: failure() && steps.alert_mismatch.outputs.created == 'true'
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"type":"text","text":"🚨 個人Threads 停止\n\nアカウント不一致が検出されました。\n\n📱 対応してください：\n\ncd ~/threads_bot\npython3 extract_cookies2.py --profile 1\ngh secret set THREADS_SESSION_PERSONAL < session.json"}]}'

      - name: Create Cookie-Expired alert (only on exit code 3)
        id: alert_cookie
        if: failure() && steps.post.outputs.exit_code == '3'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toLocaleDateString('ja-JP', {timeZone: 'Asia/Tokyo'})
            const slot = '${{ steps.params.outputs.name }}'
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cookie-expired-personal',
              per_page: 5
            })
            if (existing.data.length > 0) {
              console.log('cookie-expired-personal Issue 既存のためskip:', existing.data[0].html_url)
              core.setOutput('created', 'false')
              return
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔑 個人Threads ログイン切れ - cookie再発行が必要 (${today})`,
              body: [
                `個人アカウント(@aya_kuroki_0929)のThreads自動投稿が **ログイン切れ** で停止しました（${today} ${slot}）。`,
                ``,
                `## やること（Macのターミナルで）`,
                `\`\`\`bash`,
                `cd ~/threads_bot`,
                `python3 extract_cookies2.py --profile 1`,
                `gh secret set THREADS_SESSION_PERSONAL < session.json`,
                `\`\`\``,
                ``,
                `完了後、本workflowを手動再実行：`,
                `\`\`\``,
                `gh workflow run post_personal.yml -f slot=${slot} -f dry_run=false`,
                `\`\`\``,
                ``,
                `対応完了したらこのIssueをcloseしてください。`,
              ].join('\n'),
              labels: ['cookie-expired-personal']
            })
            core.setOutput('created', 'true')

      - name: LINE通知（個人ログイン切れ）
        if: failure() && steps.alert_cookie.outputs.created == 'true'
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"type":"text","text":"🔑 個人Threads 停止\n\nログイン切れで投稿できなくなりました。\n\n📱 対応してください：\n\ncd ~/threads_bot\npython3 extract_cookies2.py --profile 1\ngh secret set THREADS_SESSION_PERSONAL < session.json"}]}'

      - name: LINE通知（予期せぬエラー）
        if: failure() && steps.post.outputs.exit_code != '3' && steps.post.outputs.exit_code != '4' && steps.post.conclusion != 'success'
        run: |
          SLOT="${{ steps.params.outputs.name }}"
          EC="${{ steps.post.outputs.exit_code }}"
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ 個人Threads 予期せぬエラー停止\n\nスロット: ${SLOT}\n終了コード: ${EC:-不明}\n\n投稿できなかった可能性があります。\n\nhttps://github.com/AyaKuroki929/threads-bot/actions\"}]}"

      - name: セッション Cookie 自動更新（Mac不要の自己更新）
        if: steps.post.outcome == 'success' && steps.params.outputs.dry != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -f session_refreshed.json ]; then
            python3 -c "import json; d=json.load(open('session_refreshed.json')); uid=next((c['value'] for c in d.get('cookies',[]) if c['name']=='ds_user_id'),''); print('refreshed uid:', uid)"
            gh secret set THREADS_SESSION_PERSONAL --repo ${{ github.repository }} < session_refreshed.json
            echo "[session] THREADS_SESSION_PERSONAL を最新 Cookie で更新しました"
          else
            echo "[session] session_refreshed.json が見つかりません。スキップ。"
          fi

      - name: 投稿ストック自動補充（残り3本以下で発動）
        if: steps.post.outcome == 'success' && steps.params.outputs.dry != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 generate_posts.py personal

      - name: Commit state files
        if: steps.post.outcome == 'success' && steps.params.outputs.dry != 'true'
        run: |
          git config user.email "bot@github-actions"
          git config user.name "threads-bot-personal"
          git fetch origin main 2>/dev/null || true
          python3 merge_state.py commented_posts_personal.json api_usage_log.json
          git add used_posts_personal.json last_run_personal.json commented_posts_personal.json comment_targets_personal.json api_usage_log.json posts_personal.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no state changes"
          else
            git commit -m "state_personal: ${{ steps.params.outputs.name }} $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            push_ok=0
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
              git push && push_ok=1 && break || sleep 3
            done
            if [ $push_ok -eq 0 ]; then
              echo "::warning::git push failed after 3 retries. last_run.json was NOT pushed. Duplicate-post guard may fail for the next run."
            fi
          fi
