name: _patcheck
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          [ -z "$PAT" ] && { echo "PAT_EMPTY"; exit 0; }
          echo "EXPIRY_LINE:"; curl -sI -H "Authorization: Bearer $PAT" https://api.github.com/user | grep -i "github-authentication-token-expiration" || echo "NO_EXPIRY_HEADER"
