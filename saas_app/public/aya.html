<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黒木彩｜サロンオーナーを早く帰らせたい</title>
<meta name="description" content="サロンオーナーを早く帰らせたい黒木です。サロンの健康診断・うらかたさん・サロンAI塾・とうこさん・Bemolleのご案内。株式会社紫妃彩。">
<meta property="og:title" content="黒木彩｜サロンオーナーを早く帰らせたい">
<meta property="og:description" content="サロンの健康診断・うらかたさん・サロンAI塾・とうこさん・Bemolleのご案内です。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://saas.shikisai.work/aya.webp">
<style>
  :root {
    color-scheme: light;
    --plum: #4a2f52;
    --rose: #a8566a;
    --rose-pale: #f6eaee;
    --muted: #6f6276;
    --ink: #2a2130;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #faf7fa;
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 18px 56px;
    line-height: 1.7;
  }
  .wrap { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; }
  .photo {
    width: 128px; height: 128px; border-radius: 50%;
    object-fit: cover; border: 3px solid #fff;
    box-shadow: 0 8px 24px rgba(74, 47, 82, 0.18);
  }
  h1 { margin: 16px 0 2px; font-size: 1.35rem; color: var(--plum); letter-spacing: 0.06em; }
  .catch { margin: 0; font-size: 0.98rem; font-weight: 700; color: var(--rose); }
  .role { margin: 4px 0 28px; font-size: 0.82rem; color: var(--muted); text-align: center; }
  .links { width: 100%; display: flex; flex-direction: column; gap: 14px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: #fff; border: 1px solid rgba(74, 47, 82, 0.16);
    border-radius: 14px; padding: 16px 44px 16px 18px; position: relative;
  }
  a.card:active { background: var(--rose-pale); }
  a.card::after {
    content: "›"; position: absolute; right: 18px; top: 50%;
    transform: translateY(-52%); font-size: 1.6rem; color: var(--rose);
  }
  a.card.main { background: var(--plum); border-color: var(--plum); color: #fff; }
  a.card.main::after { color: #fff; }
  .name { display: block; font-weight: 700; font-size: 1.05rem; }
  .desc { display: block; font-size: 0.84rem; color: var(--muted); margin-top: 2px; }
  a.card.main .desc { color: rgba(255, 255, 255, 0.82); }
  footer { margin-top: 36px; font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <img class="photo" src="/aya.webp" alt="黒木彩">
  <h1>黒木 彩</h1>
  <p class="catch">サロンオーナーを早く帰らせたい黒木です</p>
  <p class="role">美容サロン経営10年目</p>

  <div class="links">
    <a class="card main" href="https://urakatasan-check.vercel.app">
      <span class="name">サロンの健康診断</span>
      <span class="desc">あなたのサロンで、お金と時間が<br>残らない原因が2分で分かります</span>
    </a>
    <a class="card" href="https://urakatasan.shikisai.work">
      <span class="name">うらかたさん</span>
      <span class="desc">サロンの売上・在庫・顧客を<br>まとめて管理できるアプリです</span>
    </a>
    <a class="card" href="https://saas.shikisai.work/salon-ai-school">
      <span class="name">サロンAI塾</span>
      <span class="desc">発信を続ける仕組みを<br>ご自身のサロンで作れるレッスンです</span>
    </a>
    <a class="card" href="https://saas.shikisai.work/toukosan">
      <span class="name">とうこさん</span>
      <span class="desc">Threadsに毎日3回、自動で投稿します</span>
    </a>
    <a class="card" href="https://beauty.hotpepper.jp/kr/slnH000563440/">
      <span class="name">Bemolle</span>
      <span class="desc">上本町の痩身・たるみ改善サロンです<br>ご予約はこちらから</span>
    </a>
  </div>

  <footer>株式会社紫妃彩</footer>
</div>
</body>
</html>
