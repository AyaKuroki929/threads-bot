<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黒木彩｜サロンオーナーを早く帰らせたい</title>
<meta name="description" content="サロンオーナーを早く帰らせたい黒木です。サロンの健康診断・うらかたさん・サロンAI塾・とうこさん・Bemolleのご案内。株式会社紫妃彩。">
<meta property="og:title" content="黒木彩｜サロンオーナーを早く帰らせたい">
<meta property="og:description" content="サロンの健康診断・うらかたさん・サロンAI塾・とうこさん・Bemolleのご案内です。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://saas.shikisai.work/aya.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --pink: #E8609A;
    --pink-d: #B83875;
    --pink-l: #FDE8F2;
    --grad: linear-gradient(135deg, #F487BA 0%, #D94F8A 50%, #B83875 100%);
    --text: #2A2A2A;
    --sub: #666;
    --line: #E6DED8;
    --bg: #FFFBF8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 40px 18px 56px;
    line-height: 1.7;
  }
  .wrap { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; }
  .photo {
    width: 128px; height: 128px; border-radius: 50%;
    object-fit: cover; border: 3px solid #fff;
    box-shadow: 0 8px 22px rgba(217, 79, 138, 0.22);
  }
  h1 { margin: 16px 0 2px; font-size: 1.35rem; font-weight: 900; color: var(--text); letter-spacing: 0.06em; }
  .catch { margin: 0; font-size: 0.98rem; font-weight: 700; color: var(--pink); }
  .role { margin: 4px 0 28px; font-size: 0.82rem; color: var(--sub); text-align: center; }
  .links { width: 100%; display: flex; flex-direction: column; gap: 14px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: #fff; border: 1px solid var(--line);
    border-radius: 16px; padding: 16px 44px 16px 18px; position: relative;
  }
  a.card:active { background: var(--pink-l); }
  a.card::after {
    content: "›"; position: absolute; right: 18px; top: 50%;
    transform: translateY(-52%); font-size: 1.6rem; color: var(--pink);
  }
  a.card.main { background: var(--grad); border: none; color: #fff; box-shadow: 0 8px 22px rgba(217, 79, 138, 0.28); }
  a.card.main::after { color: #fff; }
  .name { display: block; font-weight: 700; font-size: 1.05rem; }
  .desc { display: block; font-size: 0.84rem; color: var(--sub); margin-top: 2px; }
  a.card.main .desc { color: rgba(255, 255, 255, 0.9); }
  footer { margin-top: 36px; font-size: 0.75rem; color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <img class="photo" src="/aya.webp" alt="黒木彩">
  <h1>黒木 彩</h1>
  <p class="catch">サロンオーナーを早く帰らせたい黒木です</p>
  <p class="role">美容サロン経営10年目</p>

  <div class="links">
    <a class="card main" href="https://urakatasan-check.vercel.app">
      <span class="name">サロンの健康診断</span>
      <span class="desc">あなたのサロンで、お金と時間が<br>残らない原因が2分で分かります</span>
    </a>
    <a class="card" href="https://urakatasan.shikisai.work">
      <span class="name">うらかたさん</span>
      <span class="desc">サロンの売上・在庫・顧客を<br>まとめて管理できるアプリ</span>
    </a>
    <a class="card" href="https://saas.shikisai.work/salon-ai-school">
      <span class="name">サロンAI塾</span>
      <span class="desc">発信を続ける仕組みを、<br>ご自身のサロンで作れるレッスン</span>
    </a>
    <a class="card" href="https://saas.shikisai.work/toukosan">
      <span class="name">とうこさん</span>
      <span class="desc">サロン向けの、<br>Threads自動投稿サービス</span>
    </a>
    <a class="card" href="https://beauty.hotpepper.jp/kr/slnH000563440/">
      <span class="name">Bemolle</span>
      <span class="desc">大阪谷町九丁目/上本町の<br>痩身・たるみ改善サロン<br>ご予約はこちらから</span>
    </a>
  </div>

  <footer>株式会社紫妃彩</footer>
</div>
</body>
</html>
