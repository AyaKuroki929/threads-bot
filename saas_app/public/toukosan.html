<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>とうこさん｜Threads自動投稿</title>
<meta name="description" content="忙しいサロンオーナーのために、Threadsを毎日止まらず投稿し続けるシステム。月額2,750円（税込）。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fdf6f0;
    color: #3d3330;
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
  }
  .wrap {
    width: 100%;
    max-width: 780px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .eyebrow {
    margin: 0;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    color: #8d7b73;
  }
  .sheet {
    width: 100%;
    background: #fff;
    border: 1px solid rgba(242, 109, 33, 0.18);
    border-radius: 14px;
    box-shadow: 0 18px 48px rgba(126, 74, 42, 0.14);
    overflow: hidden;
    line-height: 0;
  }
  .sheet img { width: 100%; max-width: 100%; height: auto; display: block; }
  .foot {
    margin: 0;
    font-size: 0.82rem;
    line-height: 1.8;
    color: #8d7b73;
    text-align: center;
  }
  .foot strong { color: #f26d21; font-weight: 700; }
  .foot a { color: #8d7b73; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Threads 自動投稿サービス</p>
    <div class="sheet">
      <img src="/toukosan.png" width="1055" height="1491"
           alt="とうこさん サービス案内。Threadsに毎日3回（AM7:00・PM12:00・PM9:00）自動投稿。月額2,750円（税込）、最低利用期間3ヶ月。">
    </div>
    <p class="foot">

      株式会社紫妃彩<br>
      <a href="/terms.html">利用規約</a>　<a href="/tokusho.html">特定商取引法に基づく表記</a>　<a href="/privacy.html">プライバシーポリシー</a>
    </p>
  </div>
</body>
</html>
