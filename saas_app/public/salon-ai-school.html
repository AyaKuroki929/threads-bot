<style>
  :root {
    color-scheme: light;
    --plum: #4a2f52;
    --rose: #a8566a;
    --muted: #8a7b8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;

  .sheet img { width: 100%; max-width: 100%; height: auto; display: block; }
  .btn {

    background: var(--rose);

    text-decoration: none;
    font-weight: 700;

    letter-spacing: 0.06em;
    padding: 17px 46px;
    border-radius: 999px;
    box-shadow: 0 12px 26px rgba(168, 86, 106, 0.3);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .btn:hover { background: #8f4557; transform: translateY(-1px); }
  .btn-note { margin: 0; font-size: 0.82rem; color: var(--muted); }
  .foot {
    margin: 0;
    font-size: 0.82rem;
    line-height: 1.9;
    color: var(--muted);
    text-align: center;
  }
  .foot strong { color: var(--plum); font-weight: 700; }
